<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Private planner</title>
<style>
:root{--paper:#f3f2f6;--card:#ffffff;--ink:#1b1922;--ink-3:#6e687b;--line-2:#cbc5d6;--accent:#2a78d6;--on-accent:#ffffff;--crit:#d03b3b;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#121117;--card:#1c1a22;--ink:#efecf3;--ink-3:#938da0;--line-2:#433e4e;--accent:#6da7ec;--on-accent:#121117;--crit:#e05252;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121117;--card:#1c1a22;--ink:#efecf3;--ink-3:#938da0;--line-2:#433e4e;--accent:#6da7ec;--on-accent:#121117;--crit:#e05252;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--paper);color:var(--ink);font:15px/1.5 "Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:10px}
h1{margin:0 0 4px;font:400 26px/1.15 Georgia,"Times New Roman",serif;letter-spacing:-.01em}
label{font-size:12.5px;font-weight:700;color:var(--ink-3)}
input{font:inherit;color:inherit;width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--card)}
button{font:inherit;font-weight:700;min-height:42px;border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);cursor:pointer}
button:disabled{opacity:.65;cursor:progress}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{min-height:1.4em;margin:0;font-size:13.5px;color:var(--crit)}
</style>
</head>

<form id="gate" autocomplete="off">

<label for="pass">Passphrase</label>
<input id="pass" type="password" autocomplete="current-password" autofocus required>
<button id="go" type="submit">Open</button>
<p class="msg" id="msg" role="alert"></p>
</form>
